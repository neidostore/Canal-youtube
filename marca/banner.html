<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.b{width:2560px;height:1440px;position:relative;overflow:hidden;background:#0E0F13;font-family:'Inter Display',Inter,sans-serif}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}

.chart{position:absolute;inset:0}
.price{position:absolute;color:rgba(255,196,0,.16);font-weight:800;font-size:56px}
.safe{position:absolute;left:662px;top:551px;width:1235px;height:338px;display:flex;align-items:center;justify-content:center;gap:40px}
.title{color:#fff;font-weight:900;font-size:106px;letter-spacing:-3.5px;line-height:1;white-space:nowrap}
.title span{color:#FFC400}
.lema{color:#C9CBD3;font-weight:500;font-size:38px;margin-top:16px;white-space:nowrap}
.chip{display:inline-block;margin-top:20px;background:#FFC400;color:#0E0F13;font-weight:800;font-size:28px;padding:8px 22px;border-radius:999px}
</style></head><body><div class="b">
