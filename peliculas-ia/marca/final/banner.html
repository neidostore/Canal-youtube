<!doctype html><html><head><meta charset="utf-8"><style>
/* Banner de YouTube 2560x1440. Zona segura (visible en todos los dispositivos): 1546x423 en el centro.
   Fondo: banner-fondo.jpg (escenas de Gemini: pasado cálido a la izquierda, futuro frío a la derecha, centro fundido a negro).
   El logo va centrado con la I-puerta justo en la frontera entre los dos mundos. */
html,body{margin:0;background:#050608}
.lienzo{width:2560px;height:1440px;position:relative;overflow:hidden;background:#050608}
.fondo{position:absolute;inset:0;background:url(banner-fondo.jpg) center/cover no-repeat}
.logo{position:absolute;left:812px;top:443px;width:1920px;height:1080px;border:0;transform:scale(.5);transform-origin:0 0;background:transparent}
.seguro{position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:3px dashed rgba(255,80,80,.8);display:none}
body.guia .seguro{display:block}
</style></head><body><div class="lienzo">
 <div class="fondo"></div>
 <iframe class="logo" src="logo-transparente.html" scrolling="no"></iframe>
 <div class="seguro"></div>
</div>
<script>if(location.hash==='#guia')document.body.classList.add('guia')</script>
</body></html>
