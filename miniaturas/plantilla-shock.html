<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
.t{width:1280px;height:720px;position:relative;overflow:hidden;background:#04050a;font-family:'Inter Display',Inter,sans-serif}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.vig{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,10,.92) 0%,rgba(4,5,10,.55) 42%,rgba(4,5,10,0) 70%),radial-gradient(ellipse at 80% 50%,rgba(255,120,20,.25),transparent 60%)}
.rayos{position:absolute;inset:0}
.txt{position:absolute;left:50px;top:70px;width:800px}
.big{font-size:var(--fs,170px);font-weight:900;line-height:1.02;padding-top:14px;white-space:nowrap;letter-spacing:-6px;text-transform:uppercase;
     background:linear-gradient(180deg,#fff 0%,#dfe4ec 45%,#8c94a6 55%,#f2f4f8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 8px 0 #000) drop-shadow(0 0 30px rgba(30,140,255,.8))}
.y{background:linear-gradient(180deg,#FFE45C,#FFB000);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #000) drop-shadow(0 0 30px rgba(255,140,0,.7))}
.chip{display:inline-block;margin-top:26px;font-size:46px;font-weight:900;color:#fff;padding:10px 26px;border-radius:12px;background:linear-gradient(90deg,#1E8CFF,#FF7A14);box-shadow:0 6px 0 #000}
.marca{position:absolute;right:26px;bottom:22px;width:150px;opacity:.95}
</style></head><body><div class="t" id="t"></div>
<script>
const q=JSON.parse(decodeURIComponent(location.hash.slice(1))), g=k=>q[k]||'';
let h=`<div class="bg" style="background-image:url('${g('fondo')}');background-position:${g('pos')||'center'}"></div><div class="vig"></div>`;
h+=`<svg class="rayos" viewBox="0 0 1280 720"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
<polyline points="700,0 660,120 720,170 640,320 700,360 620,520" stroke="rgba(120,190,255,.9)" stroke-width="7"/>
<polyline points="700,0 660,120 720,170 640,320 700,360 620,520" stroke="#fff" stroke-width="2.5"/>
<polyline points="1280,90 1150,140 1190,200 1060,260" stroke="rgba(255,170,60,.9)" stroke-width="6"/>
<polyline points="1280,90 1150,140 1190,200 1060,260" stroke="#fff" stroke-width="2"/></g></svg>`;
h+=`<div class="txt" style="--fs:${g('fs')||'170px'}"><div class="big">${g('l1')}</div><div class="big y">${g('l2')}</div>${g('chip')?`<div class="chip">${g('chip')}</div>`:''}</div>`;
h+=`<img class="marca" src="../marca/shockmental/perfil-chatgpt.png" style="border-radius:50%">`;
document.getElementById('t').innerHTML=h;
</script></body></html>
