html,body{margin:0;background:#000}
.b{width:2560px;height:1440px;position:relative;overflow:hidden;font-family:'Inter Display',Inter,sans-serif;

.puntos{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:34px 34px}
.filo{position:absolute;left:0;right:0;height:6px;background:linear-gradient(90deg,transparent,#22D3EE 25%,#FFB020 75%,transparent)}
.seg{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:30px}

.lema b{color:#22D3EE}
.minis{display:flex;gap:16px;flex:none}
.mini{width:200px;height:113px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.6);outline:2px solid rgba(255,255,255,.08)}
.mini:nth-child(2){transform:translateY(-18px)}
.info{flex:none;width:250px;font-weight:800;color:#fff;font-size:30px;line-height:1.2}.info small{display:block;margin-top:8px;font-size:21px;font-weight:700;color:#cfd6e4;line-height:1.35}
.info .c{display:block;font-size:20px;font-weight:700;color:#FFB020;letter-spacing:1px;margin-bottom:6px}
.guia{position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:4px dashed rgba(255,0,0,.8);display:none}
</style></head><body><div class="b" id="b">
