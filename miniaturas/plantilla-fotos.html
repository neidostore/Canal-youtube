<!doctype html><html><head><meta charset="utf-8"><style>
/* Plantilla de miniatura con foto real · Detrás del Precio
   Uso: plantilla-fotos.html?izq=RUTA&der=RUTA&fondo=RUTA&t1=TEXTO&t2=TEXTO&modo=dividida|fondo&etiqueta=TEXTO&cartel=TEXTO&tachar=1 */
html,body{margin:0;background:#000}
.t{width:1280px;height:720px;position:relative;overflow:hidden;background:#0E0F13;font-family:'Inter Display',Inter,sans-serif}
.foto{position:absolute;background-size:cover;background-position:center}
.oscurecer{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,19,.85) 0%,rgba(14,15,19,.15) 45%,rgba(14,15,19,.1) 70%,rgba(14,15,19,.55) 100%)}
.txt{position:absolute;left:52px;top:34px;right:52px;color:#fff;font-weight:900;letter-spacing:-3px;line-height:.92;text-transform:uppercase;font-size:112px;text-shadow:0 6px 18px rgba(0,0,0,.7),0 4px 0 rgba(0,0,0,.5)}
.txt .y{color:#FFC400}
.tache{position:absolute}
.etiqueta{position:absolute}
.cartel{position:absolute;background:#FFC400;color:#0E0F13;border:8px solid #0E0F13;border-radius:14px;font-weight:900;font-size:62px;line-height:1;padding:22px 30px;text-align:center;transform:rotate(-6deg);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.flecha{position:absolute}
.badge{position:absolute;right:24px;bottom:20px}
</style></head><body>
<div class="t" id="mini"></div>
<script>
const q=new URLSearchParams(location.search), g=k=>q.get(k)||'';
const m=document.getElementById('mini');
const tag=(txt,fill='#FFC400',ink='#0E0F13')=>`<svg viewBox="100 170 440 280" width="100%" height="100%"><path d="M150 190 L400 190 L520 310 L400 430 L150 430 Q120 430 120 400 L120 220 Q120 190 150 190 Z" fill="${fill}" stroke="#0E0F13" stroke-width="10"/><circle cx="430" cy="310" r="24" fill="${ink}"/><text x="265" y="352" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="${txt.length>3?90:130}" fill="${ink}">${txt}</text></svg>`;
let h='';
if(g('modo')==='dividida'){
  h+=`<div class="foto" style="left:0;top:0;width:640px;height:720px;background-image:url('${g('izq')}');filter:grayscale(.35) brightness(.8)"></div>`;
  h+=`<div class="foto" style="left:640px;top:0;width:640px;height:720px;background-image:url('${g('der')}')"></div>`;
  h+=`<div style="position:absolute;left:634px;top:0;width:12px;height:720px;background:#FFC400"></div>`;
  if(g('tachar'))h+=`<svg class="tache" style="left:150px;top:250px" width="340" height="340"><line x1="20" y1="20" x2="320" y2="320" stroke="#FF3B30" stroke-width="32" stroke-linecap="round"/><line x1="320" y1="20" x2="20" y2="320" stroke="#FF3B30" stroke-width="32" stroke-linecap="round"/></svg>`;
  h+=`<svg class="flecha" style="left:575px;top:400px" width="130" height="110"><path d="M10 55 L100 55" stroke="#fff" stroke-width="22" stroke-linecap="round"/><path d="M70 15 L112 55 L70 95" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
} else {
  h+=`<div class="foto" style="inset:0;background-image:url('${g('fondo')}')"></div>`;
}
h+=`<div class="oscurecer"></div>`;
if(g('etiqueta'))h+=`<div class="etiqueta" style="right:60px;top:230px;width:300px;height:190px;transform:rotate(14deg);filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))">${tag(g('etiqueta'))}</div>`;
if(g('cartel'))h+=`<div class="cartel" style="right:70px;top:250px">${g('cartel').replace('|','<br>')}</div>`;
h+=`<div class="txt">${g('t1')}${g('t2')?' <span class="y">'+g('t2')+'</span>':''}</div>`;
h+=`<svg class="badge" width="86" height="86" viewBox="40 40 560 560"><g transform="rotate(-18 310 310)"><path d="M430 310 C 520 300, 560 250, 590 200" stroke="#FFC400" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M150 190 L400 190 L520 310 L400 430 L150 430 Q120 430 120 400 L120 220 Q120 190 150 190 Z" fill="#FFC400"/><circle cx="430" cy="310" r="24" fill="#0E0F13"/><text x="268" y="352" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="128" fill="#0E0F13" letter-spacing="-4">DP</text></g></svg>`;
m.innerHTML=h;
</script></body></html>
